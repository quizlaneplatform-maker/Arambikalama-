<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play · Aarambikallama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400&family=Kalam:wght@400;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23ff319f%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27sans-serif%27 font-weight=%27800%27 fill=%27white%27 text-anchor=%27middle%27%3EA%3C/text%3E%3C/svg%3E" />
</head>
<body class="theme-dark">
  <div class="player-top"><a class="logo" href="/">Aarambi<span>kallama!</span></a><div class="row"><span id="status"></span><span class="theme-slot"></span><button id="mute" class="btn-ghost btn-sm icon-btn" type="button"></button></div></div>
  <main id="app"><div class="center-screen"><p class="muted">Connecting…</p></div></main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script>
    const code = (qs("code") || "").trim();
    const app = document.getElementById("app");
    const statusEl = document.getElementById("status");
    const pidKey = `player:${code}`;
    const socket = io();
    let stopTimer = () => {};
    let nextTimer = 0;

    const screen = (cls, ...children) => h("div", { class: `center-screen ${cls || ""}` }, ...children);
    const show = (...nodes) => { stopTimer(); clearTimeout(nextTimer); app.replaceChildren(...nodes); };

    // ---- join screen: pick an avatar + nickname
    let avatarList = null; // numbers of the photos in /avatars
    let avatar = null;     // the one this student picked
    let lastName = "";
    const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

    async function nameForm(error) {
      if (!avatarList) {
        avatarList = await fetch("/api/avatars").then((r) => r.json()).then((d) => d.avatars).catch(() => []);
        const saved = Number(store.get("ql_avatar"));
        avatar = avatarList.includes(saved) ? saved : avatarList[Math.floor(Math.random() * avatarList.length)] ?? null;
      }
      const input = h("input", { maxlength: "20", placeholder: "Your nickname", autocomplete: "off", "aria-label": "Nickname", value: lastName, style: "font-size:1.3rem;text-align:center;font-weight:700" });
      const btn = h("button", { class: "btn-big", type: "submit" }, "Let's go");
      const preview = h("div", { class: "avatar-preview" });
      const tiles = avatarList.map((n) =>
        h("button", { type: "button", class: "avatar-tile", role: "radio", "aria-label": `Avatar ${n}`, onclick: () => choose(n) }, avatarImg(n, 56)));
      function choose(n, scroll = true) {
        avatar = n;
        store.set("ql_avatar", String(n));
        preview.replaceChildren(avatarImg(n, 112, "avatar-big"));
        tiles.forEach((t, i) => {
          const on = avatarList[i] === n;
          t.classList.toggle("on", on);
          t.setAttribute("aria-checked", on ? "true" : "false");
          if (on && scroll) t.scrollIntoView({ block: "nearest", behavior: "smooth" });
        });
      }
      const shuffle = h("button", { type: "button", class: "btn-ghost btn-sm avatar-shuffle", title: "Random avatar", "aria-label": "Random avatar", onclick: () => {
        const others = avatarList.filter((n) => n !== avatar);
        if (others.length) choose(others[Math.floor(Math.random() * others.length)]);
      } }, "🎲");
      show(screen("join-screen",
        h("span", { class: "pill" }, `Game ${code}`),
        avatarList.length ? h("div", { class: "avatar-head" }, preview, shuffle) : null,
        h("h2", { style: "margin:0" }, avatarList.length ? "Pick your avatar and nickname" : "Enter a nickname"),
        h("form", { class: "stack", style: "width:min(420px,100%)", onsubmit: (e) => {
          e.preventDefault();
          btn.disabled = true;
          lastName = input.value;
          join(input.value);
        } },
          avatarList.length ? h("div", { class: "avatar-grid", role: "radiogroup", "aria-label": "Choose your avatar" }, tiles) : null,
          input, btn),
        h("p", { class: "error" }, error || "")));
      if (avatar != null) choose(avatar, false);
      input.focus();
    }

    function join(name) {
      socket.emit("player:join", { code, name, avatar, playerId: sessionStorage.getItem(pidKey) }, (res) => {
        if (res.error) {
          sessionStorage.removeItem(pidKey);
          return res.needName ? nameForm(name === undefined ? "" : res.error) : fatal(res.error);
        }
        sessionStorage.setItem(pidKey, res.playerId);
      });
    }

    function fatal(msg) {
      show(screen("", h("div", { class: "big-emoji" }, "😕"), h("h2", null, msg), h("a", { class: "btn", href: "/" }, "Back to home")));
    }

    socket.on("connect", () => {
      if (!/^\d{6}$/.test(code)) return fatal("That game code doesn't look right.");
      join(); // with no name the server first checks the game exists, then asks for a nickname
    });

    socket.on("kicked", () => {
      sessionStorage.removeItem(pidKey);
      fatal("The teacher removed you from this game.");
    });

    socket.on("state", (s) => {
      statusEl.replaceChildren(avatarImg(s.avatar, 26), ` ${s.name} · ${s.score.toLocaleString()} pts`);
      ({ lobby, question, answered, result, done, finished })[s.view]?.(s);
    });

    function lobby(s) {
      show(screen("",
        s.avatar != null ? h("div", { class: "pulse" }, avatarImg(s.avatar, 120, "avatar-big")) : h("div", { class: "big-emoji pulse" }, "🎉"),
        h("h2", null, `You're in, ${s.name}! 🎉`),
        h("p", { class: "muted" }, s.quizTitle),
        h("p", null, s.mode === "live" ? "Watch the teacher's screen. The game starts soon." : "Waiting for the teacher to start the practice.")));
    }

    function question(s) {
      const q = s.question;
      const timer = timerBar(q.remainingMs, q.timeLimit * 1000);
      let sent = false;
      const pick = (i) => {
        if (sent) return;
        sent = true;
        socket.emit("player:answer", { index: q.index, choice: i });
      };
      show(h("div", { class: "wrap stack" },
        h("div", { class: "row spread" }, h("span", { class: "pill" }, `${q.index + 1} / ${s.total}`), s.streak >= 2 ? h("strong", null, `🔥 ${s.streak} streak`) : ""),
        timer.el,
        h("div", { class: "question-text" }, q.text),
        h("div", { class: "options" },
          q.options.map((o, i) => h("button", { class: `opt opt-${i}`, onclick: () => pick(i) }, h("span", { class: "shape" }, SHAPES[i]), o)))));
      const stopCountdown = timer.start();
      // Live games wait for everyone, so the question stays open after the timer runs out.
      const late = s.mode === "live" && setTimeout(() => {
        app.querySelector(".question-text")?.after(h("p", { class: "banner", style: "text-align:center;background:var(--brand-soft);color:var(--brand)" },
          "⏰ Time's up, but you can still answer! Everyone needs to answer before the reveal."));
      }, q.remainingMs);
      stopTimer = () => { stopCountdown(); clearTimeout(late); };
    }

    function answered(s) {
      show(screen("",
        h("div", { class: "big-emoji pulse" }, "⏳"),
        h("h2", null, "Answer locked in!"),
        h("p", { class: "muted" }, "Waiting for everyone else…")));
    }

    // ---- sound effects (synthesised with Web Audio, no files needed)
    let audio = null;
    let muted = false;
    try { muted = localStorage.getItem("ql_muted") === "1"; } catch {}
    const muteBtn = document.getElementById("mute");
    const paintMute = () => {
      muteBtn.textContent = muted ? "🔇" : "🔊";
      muteBtn.title = muted ? "Turn sound on" : "Turn sound off";
      muteBtn.setAttribute("aria-label", muteBtn.title);
    };
    paintMute();
    muteBtn.onclick = () => {
      muted = !muted;
      try { localStorage.setItem("ql_muted", muted ? "1" : "0"); } catch {}
      paintMute();
    };
    // Browsers only allow audio after a user gesture, so unlock it on the first tap/key press.
    function unlockAudio() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audio ??= new Ctx();
      if (audio.state === "suspended") audio.resume();
    }
    addEventListener("pointerdown", unlockAudio);
    addEventListener("keydown", unlockAudio);

    function tone(freq, start, dur, { type = "triangle", vol = 0.18, slideTo } = {}) {
      const t0 = audio.currentTime + start;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }

    function playSound(kind) {
      if (muted || !audio || audio.state !== "running") return;
      if (kind === "correct") {
        // bright rising arpeggio C5-E5-G5-C6, then a sparkle
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.32, { type: "triangle", vol: 0.2 }));
        tone(1568, 0.38, 0.5, { type: "sine", vol: 0.12 });
        tone(2093, 0.46, 0.45, { type: "sine", vol: 0.08 });
      } else {
        // descending "wah-wah-wah-waaah"
        [392, 370, 349.2].forEach((f, i) => tone(f, i * 0.32, 0.28, { type: "sawtooth", vol: 0.09 }));
        tone(329.6, 0.96, 0.75, { type: "sawtooth", vol: 0.09, slideTo: 277.2 });
      }
    }
    // ---- party poppers: two cannons in the bottom corners blast confetti toward the middle
    const DRAG_LOSS = 0.04; // share of speed lost to air each frame
    function partyPoppers() {
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.querySelectorAll(".popper, .confetti").forEach((n) => n.remove());
      const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
      const canvas = h("canvas", { class: "confetti", "aria-hidden": "true" });
      canvas.width = W * dpr; canvas.height = H * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      const poppers = [h("div", { class: "popper left", "aria-hidden": "true" }, "🎉"), h("div", { class: "popper right", "aria-hidden": "true" }, "🎉")];
      document.body.append(canvas, ...poppers);

      const colors = ["#ff319f", "#ffc68f", "#f0e67a", "#c9b6ff", "#7fd8c9", "#ffffff", "#ff7a59"];
      const perSide = reduce ? 30 : Math.round(Math.min(150, Math.max(80, W / 5)));
      const bits = [];
      for (const side of [-1, 1]) {           // -1 = left corner, 1 = right corner
        for (let i = 0; i < perSide; i++) {
          // Speeds are scaled to the screen: with drag, a piece travels about v / DRAG_LOSS pixels,
          // so each popper sprays from its corner across 10–95% of the width and up 45–95% of the height.
          const reachX = W * (0.1 + Math.random() * 0.85), reachY = H * (0.45 + Math.random() * 0.5);
          bits.push({
            x: side < 0 ? 18 : W - 18, y: H - 24,
            vx: -side * reachX * DRAG_LOSS, vy: -reachY * DRAG_LOSS * 1.35,
            w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
            color: colors[(Math.random() * colors.length) | 0], shape: Math.random() < 0.25 ? "circle" : "rect",
            wobble: Math.random() * 6.28, delay: Math.random() * 100, // ms: a short burst, not one flat wall
          });
        }
      }
      // Physics runs in "60 fps frames" scaled by real elapsed time, so 60 Hz and 120 Hz phones look the same.
      const start = performance.now();
      let last = start;
      const step = (now) => {
        const dt = Math.min((now - last) / 16.67, 3);
        const t = now - start;
        last = now;
        ctx.clearRect(0, 0, W, H);
        let alive = 0;
        for (const b of bits) {
          if (t < b.delay) { alive++; continue; }
          b.vy = Math.min(b.vy + 0.3 * dt, 2.2 + b.w * 0.12); // gravity, but paper flutters down slowly
          const drag = Math.pow(1 - DRAG_LOSS, dt);
          b.vx *= drag;
          if (b.vy < 0) b.vy *= drag;
          b.wobble += 0.12 * dt;
          b.x += (b.vx + Math.sin(b.wobble) * 0.6) * dt;
          b.y += b.vy * dt;
          b.r += b.vr * dt;
          if (b.y > H + 30) continue;
          alive++;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(b.r);
          ctx.globalAlpha = t > 3200 ? Math.max(0, 1 - (t - 3200) / 900) : 1;
          ctx.fillStyle = b.color;
          if (b.shape === "circle") { ctx.beginPath(); ctx.arc(0, 0, b.w / 2, 0, 6.28); ctx.fill(); }
          else ctx.fillRect(-b.w / 2, -b.h / 2 * Math.abs(Math.cos(b.wobble)), b.w, b.h * Math.abs(Math.cos(b.wobble)) + 1); // flutter
          ctx.restore();
        }
        if (alive && t < 4100) requestAnimationFrame(step);
        else canvas.remove();
      };
      requestAnimationFrame(step);
      setTimeout(() => poppers.forEach((p) => p.remove()), 1600);
    }

    let soundedFor = null; // play once per question, not again on reconnect/re-render

    function result(s) {
      const r = s.result;
      const q = s.question;
      const timedOut = r.choice === null;
      if (soundedFor !== q.index) {
        soundedFor = q.index;
        playSound(r.correct ? "correct" : "wrong");
        if (r.correct) partyPoppers();
      }
      const nextBtn = s.mode === "self" &&
        h("button", { class: "btn-big", onclick: () => socket.emit("player:next") }, s.isLast ? "Finish" : "Next question →");
      show(screen(r.correct ? "result-good" : "result-bad",
        h("div", { class: "big-emoji" }, r.correct ? "✅" : timedOut ? "⌛" : "❌"),
        h("h2", null, r.correct ? "Correct!" : timedOut ? "Time's up" : "Not quite"),
        r.correct ? h("div", { class: "points ok" }, `+${r.points}`) : null,
        !r.correct ? h("p", null, "The answer was ", h("strong", null, q.options[r.correctIndex])) : null,
        r.correct && s.streak >= 2 ? h("p", null, `🔥 ${s.streak} in a row`) : null,
        h("p", { class: "muted" }, `You're #${s.rank} of ${s.playerCount} · ${s.score.toLocaleString()} points`),
        nextBtn || h("p", { class: "muted" }, "Next question coming up…")));
      if (nextBtn) nextTimer = setTimeout(() => socket.emit("player:next"), 3500);
    }

    function done(s) {
      show(screen("",
        h("div", { class: "big-emoji" }, "🏁"),
        h("h2", null, "All done!"),
        h("p", null, `You got ${s.correct} of ${s.total} right and scored ${s.score.toLocaleString()} points.`),
        h("p", { class: "muted" }, `Currently #${s.rank} of ${s.playerCount}. Final results appear when your teacher ends the game.`)));
    }

    function finished(s) {
      sessionStorage.removeItem(pidKey);
      show(screen("",
        h("h2", null, "Game over"),
        h("div", { class: "points" }, `#${s.rank}`),
        h("p", null, `${s.correct} of ${s.total} correct · ${s.score.toLocaleString()} points`),
        podium(s.podium),
        h("a", { class: "btn", href: "/" }, "Play again")));
    }

    socket.on("disconnect", () => statusEl.textContent = "Reconnecting…");
  </script>
</body>
</html>
