<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Editor · Aarambikallama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%23ffc93c%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23ff3d6e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 font-family=%27sans-serif%27 font-weight=%27900%27 fill=%27white%27 text-anchor=%27middle%27%3EA%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="top"></div>
  <main class="wrap stack" style="max-width:860px">
    <div class="card editor-bar">
      <label class="field" style="flex:1;min-width:220px"><span>Quiz title</span><input id="title" class="title-input" maxlength="120" placeholder="Untitled quiz" /></label>
      <span class="muted small" id="count"></span>
      <p class="error" id="err" role="alert" style="flex-basis:100%"></p>
    </div>
    <div id="import"></div>
    <div id="ai"></div>
    <div id="questions" class="stack"></div>
    <button class="new-card" id="add" style="min-height:90px;width:100%;background:transparent;box-shadow:none">+ Add question</button>
  </main>
  <script src="/common.js"></script>
  <script>
    const id = qs("id");
    const err = document.getElementById("err");
    const titleInput = document.getElementById("title");
    const list = document.getElementById("questions");
    const saveBtn = h("button", { onclick: save }, "✓ Save quiz");
    teacherMenu(h("a", { class: "btn btn-ghost", href: "/dashboard.html" }, "Cancel"), saveBtn).then((menu) =>
      document.getElementById("top").replaceWith(topbar(menu)),
    );

    // ---- AI question generation (Groq or xAI Grok, whichever key the server has)
    function aiPanel(enabled, name = "AI") {
      const box = document.getElementById("ai");
      if (!enabled) {
        box.replaceChildren(h("div", { class: "card ai-card muted" }, "✨ AI question generation is off. Add a Groq key as ", h("code", null, "GROQ_API_KEY"), " (or an xAI key as ", h("code", null, "XAI_API_KEY"), ") in the .env file and restart the server to turn it on."));
        return;
      }
      const topic = h("input", { maxlength: "300", placeholder: "e.g. The water cycle, or paste a short passage" });
      const count = h("select", { value: "5", "aria-label": "Number of questions" }, [3, 5, 10, 15, 20].map((n) => h("option", { value: String(n) }, `${n} questions`)));
      const difficulty = h("select", { value: "medium", "aria-label": "Difficulty" }, ["easy", "medium", "hard"].map((d) => h("option", { value: d }, d[0].toUpperCase() + d.slice(1))));
      const grade = h("input", { maxlength: "60", "aria-label": "Grade level", placeholder: "e.g. Grade 7 (optional)" });
      const notes = h("textarea", { rows: "2", maxlength: "1000", "aria-label": "Extra instructions", placeholder: "Extra instructions (optional), e.g. include 2 true/false questions" });
      const status = h("p", { class: "muted", style: "margin:0" });
      const go = h("button", { type: "submit" }, "✨ Generate");
      box.replaceChildren(
        h("form", { class: "card ai-card stack", onsubmit: async (e) => {
          e.preventDefault();
          err.textContent = "";
          go.disabled = true;
          status.className = "muted";
          status.textContent = `${name} is writing questions… this can take up to a minute.`;
          try {
            const res = await api("/api/ai/generate", { method: "POST", body: {
              topic: topic.value, count: Number(count.value), difficulty: difficulty.value, gradeLevel: grade.value, notes: notes.value } });
            const onlyBlank = questions.length === 1 && !questions[0].text.trim() && questions[0].options.every((o) => !o.trim());
            questions = onlyBlank ? res.questions : questions.concat(res.questions);
            if (!titleInput.value.trim()) titleInput.value = res.title;
            render();
            status.textContent = `Added ${res.questions.length} question${res.questions.length === 1 ? "" : "s"}. Check them over before saving — AI can make mistakes.`;
          } catch (e2) {
            status.className = "error";
            status.textContent = e2.message;
          } finally {
            go.disabled = false;
          }
        } },
          h("div", null, h("h3", { style: "margin:0" }, "✨ Generate questions with AI"), h("p", { class: "muted small", style: "margin:0" }, `Powered by ${name}. Review every question before saving.`)),
          h("label", { class: "field" }, h("span", null, "Topic"), topic),
          h("div", { class: "ai-grid" }, count, difficulty, grade),
          notes,
          h("div", { class: "row" }, go),
          status,
        ),
      );
    }
    api("/api/auth/me").then((me) => aiPanel(me.aiEnabled, me.aiName || "AI"));

    // ---- import questions from a Word document (.docx)
    function importPanel() {
      const status = h("p", { class: "muted small", role: "status", style: "margin:0" });
      const input = h("input", { type: "file", accept: ".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document", class: "visually-hidden", tabindex: "-1", "aria-hidden": "true",
        onchange: () => { if (input.files[0]) upload(input.files[0]); input.value = ""; } });
      const pick = h("button", { type: "button", onclick: () => input.click() }, "📄 Choose Word file");

      async function upload(file) {
        err.textContent = "";
        if (!/\.docx$/i.test(file.name)) {
          status.className = "error small";
          status.textContent = /\.doc$/i.test(file.name)
            ? "This is an old .doc file. Open it in Word, choose Save As → Word Document (.docx), then import that."
            : "Choose a Word document (.docx).";
          return;
        }
        pick.disabled = true;
        status.className = "muted small";
        status.textContent = `Reading ${file.name}…`;
        try {
          const res = await fetch("/api/import/word", { method: "POST", headers: { "Content-Type": "application/octet-stream", "X-File-Name": encodeURIComponent(file.name) }, body: file });
          if (res.status === 401) return goToLogin();
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Import failed (${res.status}).`);
          const onlyBlank = questions.length === 1 && !questions[0].text.trim() && questions[0].options.every((o) => !o.trim());
          questions = onlyBlank ? data.questions : questions.concat(data.questions);
          if (!titleInput.value.trim()) titleInput.value = data.title;
          render();
          const n = data.questions.length;
          const missing = data.questions.filter((q) => q.needsAnswer).length;
          status.className = missing ? "error small" : "muted small";
          status.replaceChildren(
            `Added ${n} question${n === 1 ? "" : "s"} from ${file.name}. `,
            missing ? `${missing} ${missing === 1 ? "needs" : "need"} a correct answer: look for ⚠ below. ` : "Check them over, then save. ",
            ...(data.warnings.length ? [h("br"), ...data.warnings.flatMap((w) => [w, h("br")])] : []));
        } catch (e2) {
          status.className = "error small";
          status.textContent = e2.message;
        } finally {
          pick.disabled = false;
        }
      }

      const card = h("div", { class: "card import-card stack",
        ondragover: (e) => { e.preventDefault(); card.classList.add("drag"); },
        ondragleave: () => card.classList.remove("drag"),
        ondrop: (e) => { e.preventDefault(); card.classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f) upload(f); } },
        h("div", null,
          h("h3", { style: "margin:0" }, "📄 Import questions from Word"),
          h("p", { class: "muted small", style: "margin:0" },
            "Choose or drop a .docx file. Number each question (1., 2., …), put the options below it as A), B), C), D), and mark the answer with a line like ",
            h("code", null, "Answer: B"), ", a ✓ or * next to it, or an answer key at the end.")),
        h("div", { class: "row" }, pick, h("a", { class: "small", href: "/quiz-template.docx", download: "quiz-template.docx" }, "Download a sample Word file")),
        status,
        input);
      document.getElementById("import").replaceChildren(card);
    }
    importPanel();

    // ---- question pictures (stored in Neon Object Storage; the server keeps only the key)
    let imagesOn = false;
    api("/api/images/enabled").then((r) => { imagesOn = r.enabled; if (questions.length) render(); }).catch(() => {});

    /** Big photos are scaled down to 1600px JPEG in the browser so uploads stay under the 2 MB limit. */
    async function shrink(file) {
      if (file.type === "image/gif" || file.size <= 600 * 1024) return file;
      let bmp;
      try { bmp = await createImageBitmap(file); }
      catch { throw new Error("This picture's format isn't supported. Use a JPEG, PNG, GIF or WebP image."); }
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale);
      c.height = Math.round(bmp.height * scale);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; // transparent PNGs get a white background in JPEG
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(bmp, 0, 0, c.width, c.height);
      return new Promise((resolve) => c.toBlob(resolve, "image/jpeg", 0.85));
    }

    function imageField(q, qi) {
      if (!imagesOn) return null;
      const status = h("span", { class: "muted small", role: "status" });
      const input = h("input", {
        type: "file", accept: "image/jpeg,image/png,image/gif,image/webp", class: "visually-hidden", tabindex: "-1", "aria-hidden": "true",
        onchange: async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          pick.disabled = true;
          status.className = "muted small";
          status.textContent = "Uploading picture…";
          try {
            const body = await shrink(file);
            const res = await fetch("/api/images", { method: "POST", headers: { "Content-Type": body.type || "application/octet-stream" }, body });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `Upload failed (${res.status}).`);
            q.image = data.key;
            q.imageUrl = data.url;
            render();
          } catch (err) {
            status.className = "error small";
            status.textContent = err.message;
            pick.disabled = false;
            input.value = "";
          }
        },
      });
      const pick = h("button", { type: "button", class: "btn-ghost btn-sm", "aria-label": `${q.image ? "Replace" : "Add a"} picture for question ${qi + 1}`, onclick: () => input.click() }, q.image ? "Replace picture" : "🖼 Add picture");
      return h("div", { class: "q-image-field" },
        q.imageUrl ? h("img", { class: "q-image-preview", src: q.imageUrl, alt: `Picture for question ${qi + 1}` }) : null,
        h("div", { class: "row" },
          pick,
          q.image && h("button", { type: "button", class: "btn-ghost btn-sm", onclick: () => { delete q.image; delete q.imageUrl; render(); } }, "Remove picture"),
          status),
        input);
    }

    let questions = [];
    const blank = () => ({ text: "", options: ["", "", "", ""], correctIndex: 0, timeLimit: 20 });
    const TIMES = [5, 10, 20, 30, 45, 60, 90, 120];

    function render() {
      document.getElementById("count").textContent = `${questions.length} question${questions.length === 1 ? "" : "s"}`;
      list.replaceChildren(
        ...questions.map((q, qi) =>
          h(
            "div",
            { class: `card q-card stack${q.needsAnswer ? " needs-answer" : ""}` },
            h(
              "div",
              { class: "row spread" },
              h("strong", null, h("span", { class: "q-num" }, qi + 1), "Question"),
              h(
                "div",
                { class: "row q-tools" },
                h("select", { "aria-label": "Time limit", onchange: (e) => (q.timeLimit = Number(e.target.value)), value: String(q.timeLimit) },
                  [...new Set([...TIMES, q.timeLimit])].sort((a, b) => a - b).map((t) => h("option", { value: String(t) }, `⏱ ${t} sec`))),
                h("button", { class: "btn-ghost btn-sm", disabled: qi === 0, title: "Move up", onclick: () => move(qi, -1) }, "↑"),
                h("button", { class: "btn-ghost btn-sm", disabled: qi === questions.length - 1, title: "Move down", onclick: () => move(qi, 1) }, "↓"),
                h("button", { class: "btn-danger btn-sm", disabled: questions.length === 1, onclick: () => { questions.splice(qi, 1); render(); } }, "Remove"),
              ),
            ),
            h("textarea", { rows: "2", maxlength: "300", placeholder: "Type your question", "aria-label": `Question ${qi + 1} text`, oninput: (e) => (q.text = e.target.value) }, q.text),
            imageField(q, qi),
            q.needsAnswer
              ? h("div", { class: "answer-warning small" }, "⚠ The Word file didn't mark a correct answer for this question. Select the circle next to the right one.")
              : h("div", { class: "muted small" }, "Select the circle next to the correct answer."),
            ...q.options.map((opt, oi) =>
              h(
                "div",
                { class: `opt-row${q.correctIndex === oi && !q.needsAnswer ? " correct" : ""}` },
                h("span", { class: "swatch", style: `background:var(--opt${oi})` }, SHAPES[oi]),
                h("input", { type: "radio", name: `correct-${qi}`, checked: q.correctIndex === oi && !q.needsAnswer, "aria-label": `Answer ${oi + 1} is correct`, onchange: () => { q.correctIndex = oi; delete q.needsAnswer; render(); } }),
                h("input", { maxlength: "120", placeholder: `Answer ${oi + 1}`, "aria-label": `Question ${qi + 1}, answer ${oi + 1}`, value: opt, oninput: (e) => (q.options[oi] = e.target.value) }),
                h("button", {
                  class: "btn-ghost btn-sm", title: "Remove answer", disabled: q.options.length <= 2,
                  onclick: () => {
                    q.options.splice(oi, 1);
                    if (q.correctIndex === oi) q.correctIndex = 0;
                    else if (q.correctIndex > oi) q.correctIndex -= 1;
                    render();
                  },
                }, "✕"),
              ),
            ),
            h("div", { class: "row" },
              q.options.length < 4 && h("button", { class: "btn-ghost btn-sm", onclick: () => { q.options.push(""); render(); } }, "+ Add answer"),
              h("button", { class: "btn-ghost btn-sm", onclick: () => { q.options = ["True", "False"]; q.correctIndex = 0; render(); } }, "Make true / false"),
            ),
          ),
        ),
      );
    }

    function move(i, d) {
      [questions[i], questions[i + d]] = [questions[i + d], questions[i]];
      render();
    }

    document.getElementById("add").addEventListener("click", () => {
      questions.push(blank());
      render();
      list.lastElementChild?.querySelector("textarea")?.focus();
    });

    // Clear a stale save error as soon as the teacher edits anything.
    document.querySelector("main").addEventListener("input", () => (err.textContent = ""));

    async function save() {
      err.textContent = "";
      // Imported questions whose answer wasn't recognised must not be saved with a guessed answer.
      const unanswered = questions.findIndex((q) => q.needsAnswer);
      if (unanswered >= 0) {
        err.textContent = `Pick the correct answer for question ${unanswered + 1} before saving.`;
        toast(err.textContent);
        list.children[unanswered]?.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      saveBtn.disabled = true;
      try {
        const body = { title: titleInput.value, questions };
        await api(id ? `/api/quizzes/${id}` : "/api/quizzes", { method: id ? "PUT" : "POST", body });
        location.href = "/dashboard.html";
      } catch (e) {
        err.textContent = e.message;
        toast(e.message);
        saveBtn.disabled = false;
      }
    }

    (async () => {
      if (id) {
        try {
          const quiz = await api(`/api/quizzes/${id}`);
          titleInput.value = quiz.title;
          questions = quiz.questions;
        } catch (e) {
          err.textContent = e.message;
        }
      }
      if (!questions.length) questions = [blank()];
      render();
    })();
  </script>
</body>
</html>
